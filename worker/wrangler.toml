name = "hsely-photos"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Origines autorisées, séparées par des virgules.
# Le site Netlify + l'APK Capacitor (https://localhost).
[vars]
ALLOWED_ORIGIN = "*"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "hsely-photos"

# wrangler secret put APP_TOKEN
# Facultatif : PUBLIC_BASE_URL si un domaine est branché sur le Worker.
