name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: Build HSELY debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PHOTOS_ENDPOINT: ${{ secrets.VITE_PHOTOS_ENDPOINT }}
          VITE_PHOTOS_TOKEN: ${{ secrets.VITE_PHOTOS_TOKEN }}

      - name: Add Android platform (if absent)
        run: test -d android || npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android manifest (GPS permissions)
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hsely-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
